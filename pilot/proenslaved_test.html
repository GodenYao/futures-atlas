<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>proenslaved test · Futures Atlas v4.5 pilot (Enslaved God)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0A0E13;overflow:hidden;font:13px/1.35 'IBM Plex Mono',ui-monospace,monospace;color:#DDE3EA}
#ui{position:fixed;left:12px;top:12px;padding:10px 12px;background:rgba(10,14,19,.84);backdrop-filter:blur(6px);border:1px solid #2A323C;border-radius:6px;z-index:2}
#ui label{margin-right:8px}#ui select,#ui input{background:#141A21;color:#DDE3EA;border:1px solid #2A323C;font:inherit;padding:2px 4px}
#fps{position:fixed;left:12px;bottom:12px;padding:6px 10px;background:rgba(10,14,19,.84);border-radius:6px;white-space:pre;display:none;z-index:2}
#note{margin-top:6px;color:#9AA6B2;max-width:560px}
</style></head><body>
<div id="ui">
 <label>preset <select id="preset"></select></label>
 <label>seed <input id="seed" type="number" value="1" style="width:70px"></label>
 <label>lod <select id="lod"><option>near</option><option>mid</option><option>far</option></select></label>
 <label>ground <select id="ground"><option>hill</option><option>flat</option></select></label>
 <div id="note">Standalone review page for js/proenslaved.js (no engine; copied from protown_test.html). Bloc A (x&lt;0) / Bloc B (x&gt;0). Drag = orbit, wheel = zoom, right-drag = pan.</div>
</div>
<div id="fps"></div>
<script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push(String(e.message||e)));
window.addEventListener('unhandledrejection',e=>window.__errs.push('rej '+String(e.reason)));</script>
<script src="js/three.min.js"></script>
<script src="js/proenslaved.js"></script>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const PRE=['enslaved'];
const st={preset:Q.get('preset')||'enslaved',seed:+(Q.get('seed')||1),lod:Q.get('lod')||'near',ground:Q.get('ground')||'hill',
 mood:Q.get('mood')||'blue',q:Q.get('q')||'high',rot:+(Q.get('rot')||0.3),radius:+(Q.get('r')||15.81),mats:Q.get('mats')==='1'};
const W=innerWidth,H=innerHeight;
THREE.ColorManagement.legacyMode=false;
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(W,H);R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=st.mood==='day'?1.0:.9;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const SC=new THREE.Scene(),CAM=new THREE.PerspectiveCamera(32,W/H,.1,4000);
// B2 r4 test-page fix (?all=1 "salmon background / black octagon"): the sky sphere (r 800) was cut by the old far plane (900)
// at the d=150 overview camera -> black clear colour showed through in a sphere-facet polygon; and the 140 u ground ended
// inside the view, so the below-horizon sky (salmon horizon x .55) filled the frame. Now: far 4000, sky follows the camera,
// below-horizon sky = ground tone, ground plane 2400 u in all-mode, fog pushed out, clear colour = horizon-dark.
const ALLQ=new URLSearchParams(location.search).get('all')==='1';
// ---- simple blue-hour rig (approximation of the archviz look; NOT the engine's) ----
const blue=st.mood!=='day';
const skyU={zen:{value:new THREE.Color(blue?'#173576':'#6F9ED8')},mid:{value:new THREE.Color(blue?'#3A6CC4':'#A9C8EA')},hor:{value:new THREE.Color(blue?'#D89C84':'#E6E2D8')},gnd:{value:new THREE.Color(blue?'#3E4250':'#7E8274')}};
R.setClearColor(blue?'#2C3448':'#B8C8DA',1);
const skyM=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 zen,mid,hor,gnd;varying vec3 vP;void main(){float y=vP.y;vec3 c=mix(hor,mid,smoothstep(0.,.08,y));c=mix(c,zen,smoothstep(.08,.6,y));if(y<0.)c=mix(hor*.55,gnd,smoothstep(0.,.03,-y));gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(800,32,16),skyM);SC.add(sky);
{const pm=new THREE.PMREMGenerator(R),es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),skyM));
 SC.environment=pm.fromScene(es,0.04).texture;pm.dispose();}
SC.fog=new THREE.Fog(blue?'#2C3A6A':'#B8C8DA',ALLQ?400:120,ALLQ?1800:520);
SC.add(new THREE.HemisphereLight(blue?'#A9C6E8':'#DCE8F2',blue?'#6E6A78':'#BFB7A8',blue?.55:.9));
const sun=new THREE.DirectionalLight(blue?'#FFB07A':'#FFEFD9',blue?.55:2.0);sun.position.set(-60,blue?16:60,-40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:200});sun.shadow.bias=-.0004;SC.add(sun);
const fill=new THREE.DirectionalLight('#6A8EE6',blue?.35:.15);fill.position.set(50,40,60);SC.add(fill);
// ---- ground ----
const heightAt=(x,z)=>st.ground==='flat'?0:1.1*Math.sin(x*.07)*Math.cos(z*.055)+.35*Math.sin(x*.19+z*.15)+.004*(x*x+z*z)*.2;
let ground=null;
function makeGround(){if(ground){SC.remove(ground);ground.geometry.dispose();}
 const g=ALLQ?new THREE.PlaneGeometry(2400,2400,8,8):new THREE.PlaneGeometry(140,140,140,140);g.rotateX(-Math.PI/2);const p=g.attributes.position;
 for(let i=0;i<p.count;i++)p.setY(i,heightAt(p.getX(i),p.getZ(i)));g.computeVertexNormals();
 ground=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:blue?'#5A5B66':'#7E8274',roughness:.95}));ground.receiveShadow=true;ground.name='test_ground';SC.add(ground);}
// ---- optional fake shared materials (?mats=1) to exercise the ctx.mats path ----
function fakeMats(){const m=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,vertexColors:true},o||{}));
 return{building:m('#ffffff'),metal:m('#ffffff',{metalness:.6,roughness:.4}),ground:m('#ffffff',{roughness:.95}),light:new THREE.MeshBasicMaterial({color:'#FFC890'}),
  glass:m('#5F7380',{transparent:true,opacity:.35,roughness:.1}),foliage:m('#ffffff')};}
const mulberry=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
function ctxFor(){return{THREE,LOOK:{mood:st.mood},mats:st.mats?fakeMats():null,heightAt,rng:mulberry};}
function siteFor(preset,seed){return{id:'test_'+preset,ending:preset,x:0,z:0,y:heightAt(0,0),radius:st.radius,seed:seed,rot:st.rot,style:'archviz',q:st.q,mood:st.mood};}
// ---- build with step timing ----
const FARM={};const famMat=f=>FARM[f]||(FARM[f]=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,
 emissive:f==='light'?new THREE.Color('#FFB870'):new THREE.Color(0),emissiveIntensity:f==='light'?1.2:0}));
function buildTimed(preset,seed){const t0=performance.now();let maxStep=0,steps=0,res=null;
 const it=FA.PROENSLAVED.buildSteps(siteFor(preset,seed),ctxFor());
 for(;;){const a=performance.now();const r=it.next();const d=performance.now()-a;steps++;if(d>maxStep)maxStep=d;if(r.done){res=r.value;break;}}
 const ms=performance.now()-t0;const farG=new THREE.Group();farG.name='pt_far_view';
 for(const f of (res.far||[]))farG.add(new THREE.Mesh(f.geom,famMat(f.family)));
 return{res,ms,maxStep,steps,farG};}
// ---- measure: render each tier alone (no sky/ground) and read renderer.info ----
function infoOf(obj){const keep=[];SC.children.forEach(o=>{keep.push([o,o.visible]);o.visible=false;});
 SC.add(obj);obj.visible=true;R.info.reset();R.info.autoReset=false;R.render(SC,CAM);const o={tris:R.info.render.triangles,calls:R.info.render.calls};
 R.info.autoReset=true;SC.remove(obj);keep.forEach(([a,v])=>a.visible=v);return o;}
let cur=null;
function show(){try{if(cur){for(const g of [cur.res.near,cur.res.mid,cur.farG])if(g)SC.remove(g);}
 const b=buildTimed(st.preset,st.seed);cur=b;const res=b.res;
 for(const c of (res.casters||[]))c.castShadow=true;res.near&&res.near.traverse(m=>{if(m.isMesh)m.receiveShadow=true;});
 if(res.uniforms&&res.uniforms.uT)uT=res.uniforms.uT;
 const nm=infoOf(res.near),md=res.mid?infoOf(res.mid):null,fr=infoOf(b.farG);  // measure each tier alone BEFORE showing one
 const g=st.lod==='mid'?(res.mid||res.near):st.lod==='far'?b.farG:res.near;SC.add(g);
 window.__stats={preset:st.preset,seed:st.seed,near:nm,mid:md,far:fr,buildMs:+b.ms.toFixed(1),maxStepMs:+b.maxStep.toFixed(1),steps:b.steps,
  midRatio:md?+(md.tris/Math.max(1,nm.tris)).toFixed(3):null,gen:res.stats||null,movers:(res.movers||[]).length,lights:(res.lights||[]).length,casters:(res.casters||[]).length};
 }catch(e){window.__errs.push('show '+preset()+': '+(e&&e.stack||e));}
 function preset(){return st.preset;}}
window.PT={measure(preset,seed){const sp=st.preset,ss=st.seed;st.preset=preset;st.seed=seed==null?ss:seed;show();const s=window.__stats;st.preset=sp;st.seed=ss;return s;},
 show(p,lod){if(p)st.preset=p;if(lod)st.lod=lod;show();return window.__stats;},st,CAM,R,SC,get cur(){return cur;}};
// ---- B2 r2 review overview (?all=1): all six presets side by side on flat ground, 3 x 2 grid, label + stats per tile ----
const ALL=Q.get('all')==='1',GAP=+(Q.get('gap')||st.radius*2.6);let allG=[];
if(ALL){st.ground='flat';Object.assign(sun.shadow.camera,{left:-70,right:70,top:50,bottom:-50});sun.shadow.mapSize.set(4096,4096);sun.position.set(-90,blue?24:90,-60);}
function tileXY(i){return[((i%3)-1)*GAP,(Math.floor(i/3)-.5)*GAP];}
function showAll(){for(const g of allG)SC.remove(g);allG=[];const out=[];document.querySelectorAll('.ptlab').forEach(e=>e.remove());
 PRE.forEach((p,i)=>{try{const b=buildTimed(p,st.seed),res=b.res,[x,z]=tileXY(i);
  for(const c of (res.casters||[]))c.castShadow=true;
  const nm=infoOf(res.near),md=res.mid?infoOf(res.mid):null;
  const g=st.lod==='mid'?(res.mid||res.near):st.lod==='far'?b.farG:res.near;g.position.set(x,0,z);SC.add(g);allG.push(g);
  out.push({preset:p,near:nm,mid:md,buildMs:+b.ms.toFixed(1),maxStepMs:+b.maxStep.toFixed(1),steps:b.steps,midRatio:md?+(md.tris/Math.max(1,nm.tris)).toFixed(3):null});
  const d=document.createElement('div');d.className='ptlab';d.dataset.i=i;d.style.cssText='position:fixed;color:#E8ECF2;font:12px/1.3 monospace;background:rgba(10,14,24,.55);padding:2px 6px;pointer-events:none;white-space:pre';
  d.textContent=p+'  near '+nm.tris+'/'+nm.calls+'  build '+b.ms.toFixed(0)+' ms  max step '+b.maxStep.toFixed(1)+' ms';document.body.appendChild(d);
 }catch(e){window.__errs.push('all '+p+': '+(e&&e.stack||e));}});
 window.__all=out;window.__stats=out[0]||null;}
function placeLabels(){const v=new THREE.Vector3();document.querySelectorAll('.ptlab').forEach(d=>{const [x,z]=tileXY(+d.dataset.i);v.set(x,0,z+st.radius*1.05).project(CAM);
 d.style.left=Math.round((v.x*.5+.5)*innerWidth-d.offsetWidth/2)+'px';d.style.top=Math.round((-v.y*.5+.5)*innerHeight+4)+'px';});}
// ---- orbit camera ----
const orb={yaw:.75,pitch:.62,d:ALL?150:st.lod==='far'?90:46,tx:0,ty:1,tz:0};
if(Q.get('cam')){const c=Q.get('cam').split(',').map(Number);['yaw','pitch','d','tx','ty','tz'].forEach((k,i)=>{if(!isNaN(c[i]))orb[k]=c[i];});}
function place(){orb.pitch=Math.max(.05,Math.min(1.5,orb.pitch));orb.d=Math.max(4,Math.min(400,orb.d));
 CAM.position.set(orb.tx+orb.d*Math.cos(orb.pitch)*Math.sin(orb.yaw),orb.ty+orb.d*Math.sin(orb.pitch),orb.tz+orb.d*Math.cos(orb.pitch)*Math.cos(orb.yaw));CAM.lookAt(orb.tx,orb.ty,orb.tz);}
let drag=null;R.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button};});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(drag.b===2||e.shiftKey){const k=orb.d*.0016;orb.tx-=(Math.cos(orb.yaw)*dx)*k;orb.tz-=(-Math.sin(orb.yaw)*dx)*k;orb.tx-=Math.sin(orb.yaw)*dy*k;orb.tz-=Math.cos(orb.yaw)*dy*k;}
 else{orb.yaw-=dx*.005;orb.pitch+=dy*.004;}});
R.domElement.addEventListener('contextmenu',e=>e.preventDefault());
R.domElement.addEventListener('wheel',e=>{orb.d*=Math.exp(e.deltaY*.001);e.preventDefault();},{passive:false});
addEventListener('resize',()=>{CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
// ---- UI ----
const sel=$('preset');PRE.forEach(p=>{const o=document.createElement('option');o.textContent=p;sel.appendChild(o);});
sel.value=st.preset;$('seed').value=st.seed;$('lod').value=st.lod;$('ground').value=st.ground;
sel.onchange=()=>{st.preset=sel.value;show();};$('seed').onchange=()=>{st.seed=+$('seed').value|0;show();};
$('lod').onchange=()=>{st.lod=$('lod').value;show();};$('ground').onchange=()=>{st.ground=$('ground').value;makeGround();show();};
const FPS=Q.get('fps')==='1';if(FPS)$('fps').style.display='block';
// ---- loop ----
let uT={value:0},last=performance.now(),fr=0,fpsV=0,acc=0;const T0=performance.now();const TFIX=Q.get('t')!=null?+Q.get('t'):null;
function frame(){const now=performance.now();const T=TFIX!=null?TFIX:(now-T0)/1000;uT.value=T;
 if(cur&&cur.res.anim)try{cur.res.anim(T);}catch(e){if(window.__errs.length<20)window.__errs.push('anim '+e);}
 place();sky.position.copy(CAM.position);if(ALL)placeLabels();R.render(SC,CAM);fr++;acc+=now-last;last=now;if(acc>1000){fpsV=fr*1000/acc;fr=0;acc=0;
  if(FPS){const s=window.__stats||{};$('fps').textContent=fpsV.toFixed(1)+' fps · calls '+R.info.render.calls+' · tris '+R.info.render.triangles+
   '\n'+st.preset+' seed '+st.seed+' · near '+(s.near&&s.near.tris)+'/'+(s.near&&s.near.calls)+' · mid '+(s.mid&&s.mid.tris)+'/'+(s.mid&&s.mid.calls)+
   ' · far '+(s.far&&s.far.tris)+' · build '+s.buildMs+' ms · max step '+s.maxStepMs+' ms';}}
 requestAnimationFrame(frame);}
makeGround();
if(!window.FA||!FA.PROENSLAVED)window.__errs.push('FA.PROENSLAVED missing');else if(ALL)showAll();else show();
place();frame();window.__ready=true;
})();
</script>
</body></html>
