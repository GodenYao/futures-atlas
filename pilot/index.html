<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futures Atlas · v4.5 pilot · game-model quality sample</title>
<style>
@font-face{font-family:'Barlow SC';src:url(assets/fonts/BarlowSemiCondensed-Medium.ttf);font-weight:500}
@font-face{font-family:'Plex Mono';src:url(assets/fonts/IBMPlexMono-Regular.ttf);font-weight:400}
:root{--acc:#C9A45C;--t1:#F1ECE0;--t2:#C4BFB3;--t3:#ADA99F;--f2:'Barlow SC','Barlow Semi Condensed',system-ui,sans-serif;--f3:'Plex Mono',ui-monospace,monospace}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1230;color:var(--t1);font-family:var(--f2)}
#stage canvas{display:block;width:100vw;height:100vh;cursor:grab}
.glass{background:rgba(10,14,19,.85);backdrop-filter:blur(8px);border:1px solid rgba(130,140,160,.22)}
#hud{position:fixed;left:12px;top:10px;padding:10px 14px 11px;max-width:620px}
#hud .t{font:500 12px var(--f2);letter-spacing:.2em;color:var(--t3);text-transform:uppercase}
#hud #cur b{display:block;font:500 24px/1.15 var(--f2);letter-spacing:.02em;margin-top:4px}
#hud #cur span{font:400 13px/18px var(--f3);color:var(--t2)}
#ctl{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;padding:6px}
#ctl button{background:none;border:1px solid transparent;color:var(--t2);font:500 12px var(--f2);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;cursor:pointer}
#ctl button.on{border-color:var(--acc);color:var(--t1)}#ctl .sep{width:1px;background:rgba(130,140,160,.3);margin:2px 4px}
#foot{position:fixed;right:12px;bottom:12px;padding:5px 10px;font:400 11px var(--f3);color:var(--t3)}
#fps{position:fixed;left:50%;top:10px;transform:translateX(-50%);padding:4px 10px;font:400 11px var(--f3);color:var(--t2);display:none;z-index:9}
#fps:empty{display:none!important} /* C1: the empty perf box was the small black rectangle at top centre */
#labels{position:fixed;inset:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;will-change:transform}
.mk i{position:absolute;left:-9px;top:-9px;width:14px;height:14px;border-radius:50%;background:rgba(10,14,19,.88);border:2px solid rgba(230,224,210,.85)}
.mk .pl{position:absolute;left:14px;top:-15px;white-space:nowrap;padding:3px 8px 4px;background:rgba(10,14,19,.86);border:1px solid rgba(130,140,160,.22);border-left:2px solid var(--acc);opacity:.78}
.mk .pl em{display:none}.mk.cur .pl{opacity:1}.mk.cur .pl em{display:block}
.mk .pl b{display:block;font:500 13px var(--f2);letter-spacing:.06em}.mk .pl em{font:400 10px var(--f3);font-style:normal;color:var(--t2)}
.mk.cur i{border-color:var(--acc);width:16px;height:16px;left:-10px;top:-10px}.mk.cur .pl{display:block}
.mk.big i{display:none}.mk.big .pl{display:block;left:28px;top:-26px;padding:6px 12px 7px}.mk.big .pl b{font-size:18px}.mk.big .pl em{font-size:11px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:400 12px var(--f3);color:var(--t3);letter-spacing:.1em}
body.ready #load{display:none}
</style></head>
<body>
<div id="stage"></div><div id="labels"></div><div id="load">LOADING PILOT…</div>
<div id="hud" class="glass"><div class="t">Futures Atlas · v4.5 pilot</div><div id="cur"></div></div>
<div id="ctl" class="glass"><button data-city="gatekeeper">Gatekeeper</button><button data-city="reversion">Reversion</button><span class="sep"></span><button data-view="world">World</button><button data-view="close">Close-up</button></div>
<div id="foot" class="glass">Kit props CC0 · KayKit (Kay Lousberg) · drag to orbit · wheel to zoom · keys 1 2 V</div>
<div id="fps" class="glass"></div>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/world.js"></script>
<script src="js/a2.js"></script>
<script src="js/procity.js"></script>
<script src="js/profarm.js"></script>
<script src="js/procottage.js"></script>
<script src="js/proroad.js"></script>
<script src="js/proflora.js"></script>
<script src="js/prostream.js"></script>
<script src="js/lod.js"></script>
<script src="js/protown.js"></script>
<script src="js/proenslaved.js"></script>
<script src="js/cities.js"></script>
</body></html>
